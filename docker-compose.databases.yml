# Extra local engines only. Do not merge into docker-compose.yml
# (that file owns SQL :1433 + Redis + RabbitMQ). T-020 / T-077.
# Prefer Windows service MySQL84 when it already owns :3306; do not start this
# mysql container at the same time. Compose MySQL is the sidecar if native is off.
# Start: docker compose -f docker-compose.databases.yml up -d
# Oracle XE needs ~2GB RAM and 5-15 min on first start (EULA accepted via ORACLE_PASSWORD).
# Data on D: (T-021). App does not use MySQL/Oracle; ledger stays MSSQL.
services:
  mysql:
    image: mysql:8.4
    container_name: clearpay-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ClearPay_Dev1!}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ClearPay}
    volumes:
      - D:/ClearPay/data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: clearpay-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-ClearPay_Dev1!}
      APP_USER: ${ORACLE_APP_USER:-clearpay}
      APP_USER_PASSWORD: ${ORACLE_APP_USER_PASSWORD:-ClearPay_Dev1!}
    volumes:
      - D:/ClearPay/data/oracle:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 180s