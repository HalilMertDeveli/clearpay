# SQL Server (ledger + live Identity). Web is not a Compose service:
#   docker compose up -d
#   dotnet run --project src/ClearPay.Web --launch-profile http
# Redis + RabbitMQ: local TASK-12 stack. App does not use them until TASK-12.
# Live Azure: docs/CANLI.md (not this file).
# SQL data: D:\ClearPay\data\mssql bind (T-021). App connection = MSSQL only.
# Do not delete the old named volume clearpay-sql on C:; it is unused after this bind.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clearpay-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ClearPay_Dev1!}"
    ports:
      - "1433:1433"
    volumes:
      - D:/ClearPay/data/mssql:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: clearpay-redis
    ports:
      - "6379:6379"
    volumes:
      - clearpay-redis:/data
    command: ["redis-server", "--appendonly", "yes"]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: clearpay-rabbit
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-guest}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-guest}"
    volumes:
      - clearpay-rabbit:/var/lib/rabbitmq

volumes:
  clearpay-redis:
  clearpay-rabbit: