# SQL Server only for now (TASK-02+).
# Web is not a Compose service yet — run on the host:
#   docker compose up -d
#   dotnet run --project src/ClearPay.Web --launch-profile http
# Redis + RabbitMQ: TASK-12 (CALISMA-PLANI Faz 4). Live Azure: docs/CANLI.md (not this file).
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: clearpay-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-ClearPay_Dev1!}"
    ports:
      - "1433:1433"
    volumes:
      - clearpay-sql:/var/opt/mssql

volumes:
  clearpay-sql:
