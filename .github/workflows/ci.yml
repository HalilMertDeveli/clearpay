name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore tests/ClearPay.Tests/ClearPay.Tests.csproj
      - name: Build
        run: dotnet build tests/ClearPay.Tests/ClearPay.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test tests/ClearPay.Tests/ClearPay.Tests.csproj --no-build --configuration Release
