name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore tests/ClearPay.Tests/ClearPay.Tests.csproj
      - name: Build
        run: dotnet build tests/ClearPay.Tests/ClearPay.Tests.csproj --no-restore --configuration Release
      - name: Test
        run: dotnet test tests/ClearPay.Tests/ClearPay.Tests.csproj --no-build --configuration Release

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/clearpay
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: flutter pub get
      - name: Test
        run: flutter test
