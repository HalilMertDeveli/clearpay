# The app only knows one OTLP endpoint (this collector). Fan-out lives here, not in C#.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/seq:
    # Seq accepts OTLP/HTTP protobuf at /ingest/otlp (appends /v1/traces).
    endpoint: http://seq:80/ingest/otlp
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, otlphttp/seq]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
